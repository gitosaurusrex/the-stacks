<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a0f1d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- page-meta: on item pages the Worker swaps this block for the item's own (worker/pages.ts) -->
    <title>The Stacks</title>
    <meta name="description" content="Films, TV, music and games worth your time — in English, Japanese, Thai and Spanish." />
    <meta property="og:site_name" content="The Stacks" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Stacks" />
    <meta property="og:description" content="Films, TV, music and games worth your time — in English, Japanese, Thai and Spanish." />
    <meta name="twitter:card" content="summary" />
    <!-- /page-meta -->
    <script>
      // Pick the time-of-day palette before first paint (same hours as periodAt in src/shared/schema.ts).
      if (!location.pathname.startsWith('/admin')) {
        var h = new Date().getHours();
        document.documentElement.dataset.period = h >= 5 && h < 11 ? 'morning' : h >= 11 && h < 17 ? 'afternoon' : h >= 17 && h < 21 ? 'evening' : 'night';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Latin and Thai fonts: small, so every page loads them. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,700&family=Mali:wght@500;600&family=Noto+Sans+Thai:wght@400;500;700&family=Noto+Serif+Thai:wght@600;800&display=swap"
    />
    <!--
      Japanese fonts: about 800 kB of CSS (200 kB compressed), so only Japanese pages and the admin load them. The
      script below fills in href when the first page is either; src/fonts.ts does it on switching to 日本語.
    -->
    <link
      id="fonts-ja"
      rel="stylesheet"
      data-href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
    />
    <script>
      // Same choice as initialLang in src/i18n.tsx: ?lang= if valid, else the visitor's saved language, else English.
      (function () {
        var param = new URLSearchParams(location.search).get('lang'), saved = null;
        try { saved = localStorage.getItem('fyc-lang'); } catch (e) {}
        var ja = ['en', 'ja', 'th', 'es'].indexOf(param) >= 0 ? param === 'ja' : saved === 'ja';
        if (ja || location.pathname.startsWith('/admin')) {
          var link = document.getElementById('fonts-ja');
          link.href = link.dataset.href;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <span class="boot__mark">TS</span>
        <span class="boot__msg">Loading…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
