    <meta name="twitter:card" content="summary" />
    <!-- /page-meta -->
    <script>
      // Pick the time-of-day palette before first paint (same hours as periodAt in src/shared/schema.ts).
      if (!location.pathname.startsWith('/admin')) {
        var h = new Date().getHours();
        document.documentElement.dataset.period = h >= 5 && h < 11 ? 'morning' : h >= 11 && h < 17 ? 'afternoon' : h >= 17 && h < 21 ? 'evening' : 'night';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,700&family=Klee+One:wght@400;600&family=Mali:wght@500;600&family=Noto+Sans+Thai:wght@400;500;700&family=Noto+Serif+Thai:wght@600;800&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
    />
